name: WordPress Plugin CI
on:
  push:
    branches: [main, phase/1-foundation]
    paths: ['wordpress/growthos/**', '.github/workflows/wordpress-ci.yml']
  pull_request:
    paths: ['wordpress/growthos/**', '.github/workflows/wordpress-ci.yml']
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax certification
        run: find wordpress/growthos -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Production safety scan
        run: |
          ! grep -RInE '(SUPABASE_|supabase\.co|service_role)' wordpress/growthos --include='*.php' --include='*.js'
          ! grep -RInE '(sk_live_|pdl_live_|BEGIN (RSA |EC )?PRIVATE KEY)' wordpress/growthos
