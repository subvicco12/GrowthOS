name: WordPress Plugin CI
on:
  push:
    branches: [main, phase/1-foundation]
    paths: ['wordpress/growthos/**', '.github/workflows/wordpress-ci.yml']
  pull_request:
    paths: ['wordpress/growthos/**', '.github/workflows/wordpress-ci.yml']
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: PHP syntax certification
        run: find wordpress/growthos -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax certification
        run: find wordpress/growthos -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Production safety scan
        run: |
          ! grep -RInE '(SUPABASE_|supabase\.co|service_role)' wordpress/growthos --include='*.php' --include='*.js'
          ! grep -RInE '(sk_live_|pdl_live_|BEGIN (RSA |EC )?PRIVATE KEY)' wordpress/growthos
      - name: Production package hygiene
        run: |
          ! find wordpress/growthos -type f \( -name '.env*' -o -name '*.log' -o -name '*.sql' -o -name '*.bak' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .
          ! grep -RInE '(localhost|127\.0\.0\.1|wp_debug_log|console\.log\()' wordpress/growthos --include='*.php' --include='*.js'
      - name: Build installable plugin artifact
        run: |
          mkdir -p dist
          cd wordpress
          zip -qr ../dist/growthos.zip growthos
          cd ..
          test -s dist/growthos.zip
          unzip -t dist/growthos.zip
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: growthos-wordpress-plugin
          path: dist/growthos.zip
          if-no-files-found: error
