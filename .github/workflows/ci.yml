name: GrowthOS CI
on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'next.config.*'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'next.config.*'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: growthos-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Production architecture guard
        run: |
          ! grep -RInE 'from .*supabase|createClient\(' src/app/api --include='*.ts'
          grep -q "WordPressGrowthOSClient" src/app/api/dashboard/route.ts
          grep -q "WordPressGrowthOSClient" src/app/api/approvals/route.ts
          grep -q "INVALID_CONFIGURATION" src/app/api/dashboard/route.ts
          grep -q "INVALID_CONFIGURATION" src/app/api/approvals/route.ts
