name: GrowthOS CI
on:
  pull_request:
  push:
    branches: [main, phase/1-foundation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Production architecture guard
        run: |
          ! grep -RInE 'from .*supabase|createClient\(' src/app/api --include='*.ts'
          grep -q "WordPressGrowthOSClient" src/app/api/dashboard/route.ts
          grep -q "WordPressGrowthOSClient" src/app/api/approvals/route.ts
          grep -q "INVALID_CONFIGURATION" src/app/api/dashboard/route.ts
          grep -q "INVALID_CONFIGURATION" src/app/api/approvals/route.ts
